name: Release Flutter Native App

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v3.0.1)'
        required: true
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run Tests
        working-directory: ./flutter_app
        run: flutter test

  release:
    name: Build & Release Flutter APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.version }}"
          fi
          BUILD_NAME="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "APK_NAME=DispatchDiary-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > flutter_app/android/app/release-keystore.jks
          fi

      - name: Build Android Release APK
        working-directory: ./flutter_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name="${{ steps.vars.outputs.BUILD_NAME }}" --build-number="${{ github.run_number }}"

      - name: Copy Release APK
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk ${{ steps.vars.outputs.APK_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: Dispatch Diary ${{ steps.vars.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.vars.outputs.APK_NAME }}
