name: Build & Release Native App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK & OTA Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        env:
          VITE_APP_VERSION: ${{ github.ref_name || inputs.version }}
        run: npm run build

      - name: Package OTA Bundle (dist.zip)
        run: |
          cd dist/client
          zip -r ../../dist.zip .
          cd ../..

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../DispatchDiary.apk
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: Dispatch Diary ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DispatchDiary.apk
            dist.zip
