name: Build & Release Flutter Android APK

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Native Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: ./flutter_app
        run: flutter analyze

      - name: Run Automated Tests
        working-directory: ./flutter_app
        run: flutter test

      - name: Build Android APK
        working-directory: ./flutter_app
        run: |
          flutter build apk --release

      - name: Determine Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.0.${{ github.run_number }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "APK_NAME=dispatch-diary-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Prepare APK Asset
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk ${{ steps.vars.outputs.APK_NAME }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.APK_NAME }}
          path: ${{ steps.vars.outputs.APK_NAME }}
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: Dispatch Diary ${{ steps.vars.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.vars.outputs.APK_NAME }}
