name: Build & Release Android App

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v2.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Capacitor Android APK & OTA Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Create OTA Bundle (dist.zip)
        run: |
          cd dist/client && zip -r ../../dist.zip . && cd ../..

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Capgo switch-case for Java 17
        run: |
          sed -i 's/case DelayUntilNext.background:/case background:/g' node_modules/@capgo/capacitor-updater/android/src/main/java/ee/forgr/capacitor_updater/DelayUpdateUtils.java || true
          sed -i 's/case DelayUntilNext.kill:/case kill:/g' node_modules/@capgo/capacitor-updater/android/src/main/java/ee/forgr/capacitor_updater/DelayUpdateUtils.java || true
          sed -i 's/case DelayUntilNext.date:/case date:/g' node_modules/@capgo/capacitor-updater/android/src/main/java/ee/forgr/capacitor_updater/DelayUpdateUtils.java || true
          sed -i 's/case DelayUntilNext.nativeVersion:/case nativeVersion:/g' node_modules/@capgo/capacitor-updater/android/src/main/java/ee/forgr/capacitor_updater/DelayUpdateUtils.java || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Determine Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.1.${{ github.run_number }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "APK_NAME=DispatchDiary-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ${{ steps.vars.outputs.APK_NAME }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.APK_NAME }}
          path: |
            ${{ steps.vars.outputs.APK_NAME }}
            dist.zip
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: Dispatch Diary ${{ steps.vars.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.vars.outputs.APK_NAME }}
            dist.zip
